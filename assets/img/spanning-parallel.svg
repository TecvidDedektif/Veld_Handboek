<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 410" font-family="Barlow Semi Condensed, Barlow, Arial, sans-serif">
  <title>Spanning is druk: parallel meten. Stroom is debiet: in serie meten.</title>
  <defs>
    <marker id="pijl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#255a8a"/>
    </marker>
    <g id="kous">
      <rect x="0" y="0" width="110" height="28" rx="4" fill="#f3c300"/>
      <rect x="0" y="0" width="5" height="28" fill="#000" opacity="0.14"/>
      <rect x="105" y="0" width="5" height="28" fill="#000" opacity="0.14"/>
    </g>
  </defs>

  <!-- ===================== LINKS: druk / spanning ===================== -->
  <text x="185" y="32" font-size="26" font-weight="700" fill="#1b232b" text-anchor="middle">Spanning = druk</text>

  <!-- leiding -->
  <rect x="30" y="140" width="310" height="44" fill="#d6e6f3" stroke="#1b232b" stroke-width="3"/>
  <line x1="60" y1="162" x2="130" y2="162" stroke="#255a8a" stroke-width="4" marker-end="url(#pijl)"/>
  <line x1="240" y1="162" x2="310" y2="162" stroke="#255a8a" stroke-width="4" marker-end="url(#pijl)"/>
  <!-- manometer op de leiding -->
  <rect x="179" y="112" width="12" height="28" fill="#8d979f" stroke="#1b232b" stroke-width="2"/>
  <circle cx="185" cy="80" r="34" fill="#ffffff" stroke="#1b232b" stroke-width="3"/>
  <path d="M160,92 A28,28 0 0 1 210,92" fill="none" stroke="#8d979f" stroke-width="3"/>
  <line x1="185" y1="80" x2="205" y2="62" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
  <circle cx="185" cy="80" r="4" fill="#1b232b"/>

  <!-- elektrisch: twee draden, meter ertussen -->
  <line x1="40" y1="270" x2="330" y2="270" stroke="#1b232b" stroke-width="4"/>
  <line x1="40" y1="350" x2="330" y2="350" stroke="#1b232b" stroke-width="4"/>
  <text x="34" y="276" font-size="20" font-weight="700" fill="#1b232b" text-anchor="end">+</text>
  <text x="34" y="356" font-size="20" font-weight="700" fill="#1b232b" text-anchor="end">−</text>
  <rect x="205" y="286" width="84" height="48" rx="8" fill="#3d4750" stroke="#1b232b" stroke-width="2"/>
  <rect x="213" y="294" width="68" height="32" rx="4" fill="#c9da72"/>
  <text x="247" y="317" font-family="Share Tech Mono, Consolas, monospace" font-size="20" fill="#26330e" text-anchor="middle">24 V</text>
  <path d="M225,286 L225,270" stroke="#c62828" stroke-width="5"/>
  <path d="M269,334 L269,350" stroke="#1b232b" stroke-width="5"/>
  <circle cx="225" cy="270" r="6" fill="#c62828"/>
  <circle cx="269" cy="350" r="6" fill="#1b232b"/>
  <use href="#kous" x="60" y="296"/>
  <text x="115" y="316" font-size="18" font-weight="700" fill="#1b232b" text-anchor="middle">parallel</text>
  <text x="185" y="395" font-size="19" fill="#1b232b" text-anchor="middle">Twee punten aanraken, niets losmaken</text>

  <!-- ===================== RECHTS: debiet / stroom ===================== -->
  <text x="575" y="32" font-size="26" font-weight="700" fill="#1b232b" text-anchor="middle">Stroom = debiet</text>

  <!-- leiding doorgezaagd, watermeter ertussen -->
  <rect x="420" y="140" width="112" height="44" fill="#d6e6f3" stroke="#1b232b" stroke-width="3"/>
  <rect x="618" y="140" width="112" height="44" fill="#d6e6f3" stroke="#1b232b" stroke-width="3"/>
  <rect x="526" y="130" width="8" height="64" fill="#8d979f" stroke="#1b232b" stroke-width="2"/>
  <rect x="616" y="130" width="8" height="64" fill="#8d979f" stroke="#1b232b" stroke-width="2"/>
  <rect x="534" y="120" width="82" height="84" rx="10" fill="#ffffff" stroke="#1b232b" stroke-width="3"/>
  <rect x="546" y="140" width="58" height="26" rx="3" fill="#c9da72"/>
  <text x="575" y="160" font-family="Share Tech Mono, Consolas, monospace" font-size="16" fill="#26330e" text-anchor="middle">m³/h</text>
  <line x1="440" y1="162" x2="510" y2="162" stroke="#255a8a" stroke-width="4" marker-end="url(#pijl)"/>
  <line x1="640" y1="162" x2="710" y2="162" stroke="#255a8a" stroke-width="4" marker-end="url(#pijl)"/>
  <line x1="560" y1="185" x2="598" y2="185" stroke="#255a8a" stroke-width="4" marker-end="url(#pijl)"/>

  <!-- elektrisch: bovendraad onderbroken, meter erin -->
  <line x1="430" y1="270" x2="530" y2="270" stroke="#1b232b" stroke-width="4"/>
  <line x1="620" y1="270" x2="720" y2="270" stroke="#1b232b" stroke-width="4"/>
  <line x1="430" y1="350" x2="720" y2="350" stroke="#1b232b" stroke-width="4"/>
  <rect x="533" y="246" width="84" height="48" rx="8" fill="#3d4750" stroke="#1b232b" stroke-width="2"/>
  <rect x="541" y="254" width="68" height="32" rx="4" fill="#c9da72"/>
  <text x="575" y="277" font-family="Share Tech Mono, Consolas, monospace" font-size="18" fill="#26330e" text-anchor="middle">7.69mA</text>
  <circle cx="530" cy="270" r="6" fill="#c62828"/>
  <circle cx="620" cy="270" r="6" fill="#1b232b"/>
  <use href="#kous" x="520" y="306" transform="translate(0,0)"/>
  <text x="575" y="326" font-size="18" font-weight="700" fill="#1b232b" text-anchor="middle">in serie</text>
  <text x="575" y="395" font-size="19" fill="#1b232b" text-anchor="middle">Draad los, meter ertussen</text>
</svg>
