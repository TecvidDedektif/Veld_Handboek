<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" font-family="Barlow Semi Condensed, Barlow, Arial, sans-serif">
  <title>Passieve stroomuitgang: klem A en A-, een externe voeding moet de lus voeden</title>
  <text x="190" y="30" font-size="23" font-weight="700" fill="#1b232b" text-anchor="middle">Passief: A en A−</text>
  <!-- flowmeter -->
  <rect x="14" y="56" width="142" height="190" rx="10" fill="#eef2f3" stroke="#1b232b" stroke-width="3"/>
  <text x="28" y="84" font-size="17" font-weight="700" fill="#1b232b">Flowmeter</text>
  <text x="72" y="158" font-size="14" fill="#56626d" text-anchor="middle">regelt alleen</text>
  <text x="72" y="174" font-size="14" fill="#56626d" text-anchor="middle">de stroom</text>
  <rect x="134" y="98" width="34" height="24" rx="3" fill="#ffffff" stroke="#1b232b" stroke-width="2"/>
  <text x="151" y="115" font-size="14" font-weight="700" fill="#1b232b" text-anchor="middle">A</text>
  <rect x="134" y="182" width="34" height="24" rx="3" fill="#ffffff" stroke="#1b232b" stroke-width="2"/>
  <text x="151" y="199" font-size="14" font-weight="700" fill="#1b232b" text-anchor="middle">A−</text>
  <!-- externe voeding -->
  <rect x="180" y="86" width="44" height="48" rx="6" fill="#f3c300" stroke="#1b232b" stroke-width="2"/>
  <text x="202" y="108" font-size="14" font-weight="700" fill="#1b232b" text-anchor="middle">24 V</text>
  <text x="202" y="124" font-size="11" fill="#1b232b" text-anchor="middle">extern</text>
  <!-- ontvanger -->
  <rect x="248" y="56" width="118" height="190" rx="10" fill="#ffffff" stroke="#1b232b" stroke-width="3"/>
  <text x="307" y="84" font-size="16" font-weight="700" fill="#1b232b" text-anchor="middle">Ontvanger</text>
  <text x="307" y="104" font-size="13" fill="#56626d" text-anchor="middle">ingang</text>
  <rect x="236" y="98" width="26" height="24" rx="3" fill="#ffffff" stroke="#1b232b" stroke-width="2"/>
  <rect x="236" y="182" width="26" height="24" rx="3" fill="#ffffff" stroke="#1b232b" stroke-width="2"/>
  <!-- draden -->
  <line x1="168" y1="110" x2="180" y2="110" stroke="#1b232b" stroke-width="4"/>
  <line x1="224" y1="110" x2="236" y2="110" stroke="#1b232b" stroke-width="4"/>
  <line x1="168" y1="194" x2="236" y2="194" stroke="#1b232b" stroke-width="4"/>
  <text x="190" y="280" font-size="17" fill="#1b232b" text-anchor="middle">Zonder voeding in de lus: 0 mA.</text>
  <text x="190" y="304" font-size="17" fill="#1b232b" text-anchor="middle">De voeding kan ook in de ontvanger zitten.</text>
</svg>
